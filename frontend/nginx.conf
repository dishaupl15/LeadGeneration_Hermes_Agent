# ─────────────────────────────────────────────────────────────────────────────
#  Nginx configuration — LeadCRM frontend (React SPA)
#
#  This config serves the Vite production build and handles SPA deep-linking.
#  Every path (including /f/:slug, /dashboard, /forms, etc.) returns index.html
#  so React Router can handle the route on the client side.
#
#  Usage:
#    1. Build the frontend:  npm run build   (output → dist/)
#    2. Copy dist/ to your web server root (or use the Docker setup)
#    3. Include / replace your server nginx.conf with this file
#
#  Key SPA rule:  try_files $uri $uri/ /index.html
#    This ensures that a direct visit to /f/my-form-A1B2C3 (or a page refresh)
#    returns index.html instead of a 404.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;          # replace with your domain in production

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # ── Static asset caching (Vite fingerprints assets with hashes) ────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — CRITICAL for React Router deep links ───────────────────
    # All routes that don't map to a static file are served index.html.
    # This covers:
    #   /f/:form_id          → public form page
    #   /dashboard           → CRM dashboard
    #   /forms               → form management
    #   /social-leads        → social leads module
    #   /generate            → lead generation
    #   (and any other React route added in the future)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
